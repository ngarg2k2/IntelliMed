<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IntelliMed educational symptom assessment and smart pharmacy demo">
  <title>{% block title %}IntelliMed{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">IM</span><span>IntelliMed</span></a>
    <nav aria-label="Primary navigation">
      <a href="/assessment">Assessment</a>
      <a href="/catalog">Pharmacy</a>
      {% if user and user.role == 'admin' %}<a href="/admin">Inventory</a>{% endif %}
    </nav>
    <div class="header-actions">
      <a class="icon-link" href="/cart" aria-label="Cart"><i data-lucide="shopping-bag"></i><span>{{ cart_count }}</span></a>
      {% if user %}
      <span class="user-name">{{ user.name }}</span>
      <form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="icon-button" aria-label="Log out" title="Log out"><i data-lucide="log-out"></i></button></form>
      {% else %}<a class="button button-small" href="/login">Sign in</a>{% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><span>IntelliMed prototype</span><span>Educational decision support only. Not medical advice.</span></footer>
</body>
</html>
