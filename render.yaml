services:
  - type: web
    name: intellimed
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: INTELLIMED_ENV
        value: production
      - key: INTELLIMED_DATABASE_URL
        sync: false
      - key: INTELLIMED_SESSION_SECRET
        generateValue: true
      - key: INTELLIMED_SECURE_COOKIES
        value: true
      - key: INTELLIMED_ADMIN_EMAIL
        sync: false
      - key: INTELLIMED_ADMIN_PASSWORD
        sync: false